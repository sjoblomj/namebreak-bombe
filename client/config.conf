# Which mode to run: continuous, bounded, coordinator, dictionary or
# meet-in-the-middle. Can be overridden by passing the mode as this
# program's argument instead, e.g. `./namebreak --mode bounded` - useful for
# switching modes without editing this file, since every mode's section
# lives here at once regardless of which mode is actually active.
mode = coordinator

# Optional, default matches: the directory the matches files (and the
# progress files, found.txt and false_matches.txt) are written to. It's
# created if missing.
# matches_dir = matches

# Optional: the backend to search with - cuda, hip, metal, opencl or cpu,
# whichever this build has. Unset, the first one that can run here. Can be
# overridden with `--backend <name>`.
# backend = opencl

# Optional, default true: whether to look for a newer release at startup.
# It never downloads anything.
# check_for_updates = true



# ########################



# Parameters for `coordinator` mode: namebreak registers with a coordinator
# server, claims ranges from it, searches them, and reports back - see
# ../coordinator/README.md.
[coordinator]
server_url = https://namebreak-coordinator.fly.dev

# Optional: who and what this client is on the coordinator's dashboard. Left
# out, they're detected and confirmed on the first run, then written here.
# With several GPUs, GPU N registers as <hostname>/gpu<N>.
# username = your-name
# hostname = your-machine

# Optional, default 30: seconds to wait between /claim attempts when the
# server currently has no work available.
# poll_interval_secs = 30



# ########################



# Parameters for `bounded` and `continuous` mode - they take the same
# parameters, only `mode` above picks which actually runs. `bounded` stops
# once upper_bound is exhausted at its own candidate length; `continuous`
# keeps going to longer candidate lengths indefinitely.
[search]

# The full set of characters namebreak brute-forces candidates from.
alphabet = " !&'()+,-.0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_"

# The fixed parts of the filename around the candidate.
prefix = REZ\
suffix = .WAV

# Optional, default false. If true, the search will resume from the last
# candidate that was processed, rather than from what is given in
# `start_candidate`. This is useful if the search was interrupted and
# you want to continue where it left off.
resume_from_last_candidate = true

# Optional. Full filename (prefix+candidate+suffix) to begin searching from.
# start_candidate = REZ\FZ00ODM0K.WAV

# Full filenames (prefix+candidate+suffix), inclusive on both ends.
lower_bound = REZ\FINZ09BX.TXT
upper_bound = REZ\GAMEMENU.BIN

# Target MPQ hashes to search for, hex ("0x" prefix optional).
hash_a = 0xF60F5D90
hash_b = 0xCE0A9BDB

# Optional, default false. Skips candidates with 3+ consecutive
# non-alphanumeric, non-space characters (real MPQ filenames essentially
# never have runs like that) - a cheap pre-filter, not a correctness rule.
prune_symbol_runs = true

# Optional, default false. Skip candidates that close a bracket
# never opened: reading left to right, a `)` at a point where more `)`
# than `(` have been seen, or likewise a `]` with `[`. The two kinds
# are counted separately (how they nest within each other isn't checked).
# Brackets left open by `prefix` count as opened, so a candidate may
# close those.
prune_unopened_brackets = true

# Optional, default false. Apply prune_symbol_runs, prune_unopened_brackets,
# max_backslash_count, min_backslash_count and prune_adjacent_backslashes
# to every character of a candidate but the last,
# not only to the leading ones (all but the last five or so): about a fifth
# fewer candidates are searched, and the search is about 10% faster on a GPU.
prune_whole_candidate = false

# Max '\' occurrences allowed in a candidate. 0 means unlimited.
max_backslash_count = 0

# Optional, default 0. Min '\' occurrences a candidate must have - the
# prefix's own don't count. A candidate is skipped once the characters
# checked (see prune_whole_candidate) leave too few after them for the
# rest, even if all of those were '\'. At most max_backslash_count, unless
# that's 0.
min_backslash_count = 0

# Optional, default false. Skip candidates with two '\' next to each other,
# counting a '\' the prefix ends with.
prune_adjacent_backslashes = false

# Optional. Text inserted into every candidate, and the position it goes
# at: after the candidate's first `position` characters (insert_from_start),
# or before its last `position` (insert_from_end) - e.g. `\, 3`. A candidate
# shorter than the position gets nothing inserted. lower_bound and
# upper_bound are without it; start_candidate and the matches are with it.
# insert_from_start = \, 3
# insert_from_end = \, 4

# Optional. What's known about the file, which a match of both hashes must
# fit, or it's reported as a false match and the search goes on: its raw
# encryption key, hex (mpqcli's encryption-key-raw), which the match's
# basename must hash to; and where its entry is in the archive's hash table
# (all three or none). See README.md's "Configuring".
# encryption_key = 0x1d5ad26c
# hash_table_size = 4096
# hash_table_first_start_slot = 1200
# hash_table_last_start_slot = 1203

# Optional. Names the matches file matches-<matches_name>.txt instead of
# matches.txt, so that searches for different files don't share one.
# matches_name = rez-wav



# ########################



# Parameters for `dictionary` mode: candidates made of words - one word, or
# several with a separator between each two - from the dictionary compiled
# into namebreak and word lists of your own. The filename is still
# prefix + candidate + suffix. Letters are made uppercase and '/' made '\'
# everywhere, as Storm hashes a name. Runs on the GPU if there is one, as
# the other modes do. See README.md's "Dictionary mode".
#
# A list (dictionaries, separators, tails) is items separated by commas,
# each either "quoted" - kept exactly, spaces and commas included - or not,
# and then trimmed. "" is an empty item.
[dictionary]
# Optional, default english-1: the dictionary compiled into namebreak
# (63,875 English words), or none to search only `dictionaries`.
# builtin_dictionary = english-1

# Optional. More word lists, as a list of files (relative to the current
# directory, unless absolute): one word per line; blank lines and lines
# starting with '#' are skipped. Every list's words and the compiled-in
# dictionary's are searched together, each once.
dictionaries = lists/starcraft-words.txt, "lists/my words.txt"

# How many words a candidate has: every count from min_words (optional,
# default 1) to max_words (at most 8), fewest first.
min_words = 1
max_words = 2

# Optional, default "": what goes between two words. "" writes them
# together; "\" makes the words before it directories.
separators = "", "_", "-", " "

# Optional, default none: what follows the last word - every string made of
# one of each element's, in turn. digits:A-B is every string of A to B
# digits, letters:A-B the same of A-Z, and X|Y|... one of those literal
# strings ("" among them if it ends with '|'). This one makes 0 to 9Z.
# tails = digits:1-2, letters:0-1

# The fixed parts of the filename around the candidate.
prefix = "REZ\"
suffix = .TXT

# Optional. Full filenames, inclusive on both ends - either may be left out.
# lower_bound = REZ\CRDT_LST.TXT
# upper_bound = REZ\GAMEMENU.BIN

# Target MPQ hashes to search for, hex ("0x" prefix optional).
hash_a = 0xC4F43358
hash_b = 0x7694C48D

# Optional. The file's raw encryption key, hex: hash type 3 of its basename,
# before the adjustment for its position and size in the archive (mpqcli's
# encryption-key-raw). Every candidate whose basename - what follows the
# filename's last '\' - hashes to it is written to basenames.txt, and,
# unless the suffix has a '\', only those are compared to hash_a and hash_b:
# about a third faster, but a wrong key hides the file.
encryption_key = 0x4565C467

# Optional, default true with an encryption_key, false without: whether to
# write those basenames. About one candidate in 4,294,967,296 matches by
# chance - the search says how many to expect before it starts.
# record_basenames = true

# Optional, default false: with an encryption_key, compare every candidate
# to hash_a and hash_b all the same, so a wrong key can't hide the file -
# about a third slower.
# record_hasha_matches = false

# Optional, all three or none: where the file's entry is in its archive's
# hash table, as in [search].
# hash_table_size = 4096
# hash_table_first_start_slot = 1200
# hash_table_last_start_slot = 1203

# Optional. Names the files the search writes in matches_dir:
# matches-<matches_name>.txt, basenames-<matches_name>.txt and
# wordnumber-<matches_name>.txt (the progress file) - without it,
# matches.txt, basenames.txt and wordnumber.txt.
matches_name = sc-ptbr-credits

# Optional, default false. If true, the search carries on from its progress
# file (wordnumber.txt) - unless that was written by a search with other
# words, separators, word counts, tails, prefix, suffix, bounds, hashes or
# encryption key, which it refuses to resume.
resume_from_last_candidate = true



# ########################



# Parameters for `meet-in-the-middle` mode: a file whose name is a known
# prefix, an unknown directory and a known suffix, where the MPQ hash state
# right after the directory - the meeting point - is already known for hashA
# and for hashB (two files of the same unknown directory whose basenames are
# known pin one down). The search then comes at the directory from both ends
# at once: forward from the prefix into a table, backward from the meeting
# point, meeting in the middle - so each character the table holds is one
# character the search doesn't brute-force. See README.md's
# "Meet-in-the-middle mode".
[meet-in-the-middle]
# The characters the unknown directory is made of. A '\' among them searches
# directories with subdirectories in them.
alphabet = " ()-.0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\_"

# Optional, default none: known text before the unknown directory. The
# meeting point must be the state after the prefix *and* the directory.
# prefix = ""

# What follows the directory - for a file in it, the '\' and the basename.
suffix = \BWUNIN.PIF

# The hash state after the directory, hex: hashA's two seeds, then hashB's
# (optional, both or neither - only used to check the meeting point).
meeting_point_a_seed1 = 0x92F62345
meeting_point_a_seed2 = 0xB9F61953
meeting_point_b_seed1 = 0xB95115E6
meeting_point_b_seed2 = 0x7609B4F4

# The file's own two hashes, hex. Hashing `suffix` onto the meeting point must
# give these, or the search refuses to start - a meeting point for the wrong
# place in the name would otherwise search everything and find nothing.
hash_a = 0x5BAB63FE
hash_b = 0x8DF2CB08

# How long the directory may be. min_length is optional, default 1;
# max_length is at most 16 characters.
min_length = 1
max_length = 8

# Optional: how many of the directory's first characters the table holds.
# Left out, as many as table_memory has room for.
# table_length = 4

# Optional, default 1G: how much memory the table may take - bytes, or with
# a K, M or G after it. A character more costs as many times more memory as
# the alphabet has characters, so 1G buys four characters of the alphabet
# above, and 2G five.
table_memory = 1G

# Optional. The same cheap rules as [search] - but applied to every
# character of the directory, not only its leading ones, and
# prune_adjacent_backslashes also counts a '\' the suffix begins with next
# to one the directory ends with.
prune_symbol_runs = true
prune_unopened_brackets = false
prune_adjacent_backslashes = true
max_backslash_count = 0
min_backslash_count = 0

# Optional. What's known about the file, which a match of both hashes must
# fit, or it's reported as a false match and the search goes on - as in
# [search]: its raw encryption key, hex, and where its entry is in the
# archive's hash table (all three or none).
# encryption_key = 0x1d5ad26c
# hash_table_size = 4096
# hash_table_first_start_slot = 1200
# hash_table_last_start_slot = 1203

# Optional. Names the files the search writes in matches_dir:
# matches-<matches_name>.txt and meet-in-the-middle-<matches_name>.txt (the
# progress file) - without it, matches.txt and meet-in-the-middle.txt.
matches_name = bwunin

# Optional, default false. If true, the search carries on from its progress
# file - unless that was written by a search with another alphabet, prefix,
# suffix, meeting point, hashes, lengths, table length or rules, which it
# refuses to resume.
resume_from_last_candidate = true



# ########################



# Which parts of the machine to search with, and how - in every mode. Every
# key is optional. See README.md's "Choosing and tuning the hardware".
[hardware]
# Optional, default auto: every discrete GPU (or the integrated one if
# there's nothing else). Also all, none (the cpu backend), or GPU numbers
# separated by commas, as `namebreak --list-gpus` shows them. Coordinator
# mode searches on every GPU picked at once; the other modes on the first.
# gpus = 0, 2

# Optional, default 0: the cpu backend's threads, 0 for one per hardware
# thread.
# cpu_threads = 8

# Optional, default 0 (none): how much memory to give a meet-in-the-middle
# target's table in coordinator mode, per GPU - bytes, or with a K, M or G
# after it (see README.md's "Meet-in-the-middle mode"). The server hands out
# no meet-in-the-middle target whose table is bigger than this, and none at
# all while this is 0, so it's how much you agree to spare for that work. On
# a GPU the table has to fit in the device's own memory too, so keep it
# under what the card has free; `--backend cpu` uses the machine's.
# meet_in_the_middle_table_memory = 2G

# Optional: the OpenCL and Metal backends' launch geometry - unset being the
# backend's default. None of them changes what a search finds. Rather than
# guessing, `namebreak --autotune` measures them and writes the fastest
# here. CUDA and HIP take none of them (see scripts/autotune/).
# rows_per_thread = 64
# batches_per_launch = 16
# window_chars = 5
# work_group_size = 256
# dictionary_words_per_thread = 32
# dictionary_work_group_size = 256
# dictionary_tails_per_cell = 32

# gpu<N>.<any of those> is GPU N's own, over the ones above, and gpu<N>.name
# the GPU they're meant for: should another card have number N now, it
# doesn't get them.
# gpu1.name = AMD Radeon RX 7900 XTX
# gpu1.rows_per_thread = 25
