<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>namebreak coordinator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #dde1e6;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #2563eb;
    --pending: #9ca3af;
    --in-progress: #d97706;
    --completed: #16a34a;
    --skipped: #7c3aed;
    --solved-bg: #fff8e1;
    --solved-border: #f5c518;
    --solved-text: #7a5b00;
    --row-in-progress-bg: #fff4e5;
    --detail-bg: #f7f8fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1c1f24;
      --border: #2b2f36;
      --text: #e7e9ec;
      --muted: #9aa1ab;
      --accent: #5b8def;
      --pending: #7c8290;
      --in-progress: #e0a13a;
      --completed: #3ecf6e;
      --skipped: #a78bfa;
      --solved-bg: #2c2405;
      --solved-border: #caa314;
      --solved-text: #ffd75e;
      --row-in-progress-bg: rgba(224, 161, 58, 0.14);
      --detail-bg: rgba(255, 255, 255, 0.04);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subhead {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .subhead #status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--completed);
    margin-right: 6px;
  }
  .subhead.stale #status-dot { background: var(--pending); }
  .targets {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 1800px;
  }
  .target-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .target-card.solved {
    background: var(--solved-bg);
    border: 2px solid var(--solved-border);
  }
  .target-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .target-name {
    font-size: 16px;
    font-weight: 600;
  }
  .target-hashes {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }
  .target-bounds {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }
  .target-skip {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .target-skip .mono { color: var(--skipped); }
  .target-description {
    color: var(--text);
    font-size: 13px;
    margin-top: 6px;
  }
  .target-description :first-child { margin-top: 0; }
  .target-description :last-child { margin-bottom: 0; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
  }
  .badge.status-active { background: var(--accent); }
  .badge.status-paused { background: var(--muted); }
  .badge.status-solved { background: var(--completed); }
  .badge.status-pending { background: var(--pending); }
  .badge.status-in_progress { background: var(--in-progress); }
  .badge.status-completed { background: var(--completed); }
  .badge.status-skipped { background: var(--skipped); }
  .priority-chip {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .target-alphabet {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }
  .target-alphabet .mono { cursor: help; }
  .found-banner {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--solved-border);
    color: #1a1a1a;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .found-banner .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: rgba(0,0,0,0.18);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .found-banner .filename {
    font-family: var(--mono);
    background: rgba(255,255,255,0.5);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .found-banner .found-by {
    font-weight: 500;
    font-size: 13px;
  }
  .priority-section {
    margin-top: 14px;
  }
  .priority-heading {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .priority-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .priority-table th, .priority-table td {
    text-align: left;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  .priority-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr.gap-row td {
    color: var(--muted);
    font-style: italic;
    background: var(--detail-bg);
  }
  .table-scroll {
    overflow-x: auto;
    max-width: 100%;
    margin-top: 14px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td.worker { white-space: normal; }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  td.mono, .mono { font-family: var(--mono); white-space: pre; }
  td.worker { color: var(--text); }
  td.worker.none, .muted { color: var(--muted); font-style: italic; }
  .lease-note {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
  }
  .expired-text { color: #b91c1c; font-weight: 600; }
  .progress-note {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
  }
  tr.range-row.status-in_progress { background: var(--row-in-progress-bg); }
  tr.range-row {
    cursor: pointer;
  }
  .expand-hint {
    display: none;
    margin-left: 6px;
    color: var(--muted);
    font-style: normal;
  }
  tr.range-row.open .expand-hint { transform: rotate(90deg); display: inline-block; }
  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td {
    background: var(--detail-bg);
    white-space: normal;
  }
  .detail-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 28px;
  }
  .detail-grid > div {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .detail-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr.collapsed-row td {
    background: var(--detail-bg);
    white-space: normal;
  }
  .collapsed-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 12px;
    padding: 2px 0;
  }
  .collapsed-dots {
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
  }
  .collapsed-btn {
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .collapsed-btn:hover { background: var(--card-bg); }
  /* Hide columns narrowest-screens-first, in the order: Count, Completed,
     Assigned, Worker, Range - the row itself stays clickable to reveal them
     (the expand hint that signals this lives in the Status column, which is
     never hidden, rather than in Range itself). Thresholds are the measured
     intrinsic minimum width of each column configuration (a 10-character
     candidate range and a long worker name, plus the Status column's *typical*
     content - "PENDING"/"DONE", not the longer "IN PROGRESS: 100%") plus the
     ~90px of fixed card/table chrome around the scrollable area - so each
     breakpoint fires exactly when the previous configuration would otherwise
     start overflowing for that typical content, with no gap of unavoidable
     horizontal scroll in between. Sizing around the Status column's typical
     rather than worst-case content is a deliberate tradeoff: it keeps more
     columns visible on an ordinary board (mostly pending/completed ranges),
     at the cost of the table needing its own horizontal scroll (inside
     .table-scroll) on a board with many simultaneous long in-progress badges.
     The final, mobile-width breakpoint drops Range too, since Status/Len/
     First-last alone are still too wide for a phone screen otherwise. */
  @media (max-width: 1150px) {
    .col-count { display: none; }
    .expand-hint { display: inline-block; }
  }
  @media (max-width: 1040px) {
    .col-completed { display: none; }
  }
  @media (max-width: 950px) {
    .col-assigned { display: none; }
  }
  @media (max-width: 810px) {
    .col-worker { display: none; }
  }
  @media (max-width: 600px) {
    .col-range { display: none; }
    th, td { padding: 6px 4px; }
    /* Keep the badge itself but trim it to just the percentage, and move the
       lease's expiry out of the collapsed row entirely - both are still
       available (the full "In progress: xx%" wording, and "Expires HH:MM")
       in the detail row a tap on the row reveals. */
    .badge-prefix { display: none; }
    .lease-note { display: none; }
  }
  .empty-ranges {
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
  }
  .loading, .error {
    color: var(--muted);
    font-size: 14px;
  }
  .error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>namebreak coordinator</h1>
  <div class="subhead"><span id="status-dot"></span><span id="status-text">loading…</span></div>
  <div id="targets" class="targets"></div>

<script>
(function () {
  const targetsEl = document.getElementById('targets');
  const statusEl  = document.getElementById('status-text');
  const subheadEl = document.querySelector('.subhead');

  // Displayed as "YYYY-mm-dd HH:MM:ss" in the viewer's own local timezone
  // (whatever the browser reports); the full ISO-8601 string (UTC, with T, Z
  // and milliseconds) goes in a tooltip for anyone who needs the precise,
  // unambiguous value.
  function fmtTime(unixSeconds) {
    if (unixSeconds === null || unixSeconds === undefined) return null;
    const d = new Date(unixSeconds * 1000);
    const pad = (n) => String(n).padStart(2, '0');
    const display = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
                     `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    return { display, iso: d.toISOString() };
  }

  function setTimeCell(td, unixSeconds) {
    const t = fmtTime(unixSeconds);
    if (t) {
      td.textContent = t.display;
      td.title = t.iso;
    } else {
      td.textContent = '—';
    }
  }

  function fmtPercent(n) {
    return Math.max(0, Math.min(100, n)).toFixed(1) + '%';
  }

  function fmtPercentRounded(n) {
    return Math.round(Math.max(0, Math.min(100, n))) + '%';
  }

  function fmtNum(n) {
    return Number(n).toLocaleString();
  }

  function statusBadge(status, label) {
    const span = document.createElement('span');
    span.className = 'badge status-' + status;
    if (label instanceof Node) {
      span.appendChild(label);
    } else {
      span.textContent = label || status.replace('_', ' ');
    }
    return span;
  }

  // "In progress: 42%", with the "In progress: " part wrapped so CSS can
  // drop it on very small screens and leave just the percentage. No
  // heartbeat yet (percent == null) reads as 0%, not a bare "in progress".
  function inProgressLabel(percent) {
    const frag = document.createDocumentFragment();
    const prefix = document.createElement('span');
    prefix.className = 'badge-prefix';
    prefix.textContent = 'In progress: ';
    frag.appendChild(prefix);
    frag.append(fmtPercentRounded(percent != null ? percent : 0));
    return frag;
  }

  // "username@hostname" (see dashboard.rs's display_name) rendered as
  // "username @ hostname" with a <wbr> right before the hostname, so it only
  // breaks onto its own line when the column is actually too narrow for it.
  function workerFragment(worker) {
    const frag = document.createDocumentFragment();
    if (!worker) {
      frag.append('Nobody');
      return frag;
    }
    const atIndex = worker.indexOf('@');
    if (atIndex === -1) {
      frag.append(worker);
      return frag;
    }
    frag.append(worker.slice(0, atIndex) + ' @ ');
    frag.appendChild(document.createElement('wbr'));
    frag.append(worker.slice(atIndex + 1));
    return frag;
  }

  const DETAIL_COLSPAN = 8;

  // The row itself carries the fields that stay visible at every width
  // (Status, Len, First/last candidate); Count, Worker, Assigned, Completed
  // and (last, at mobile widths) Range get their own "col-*" class so CSS can
  // hide them on narrow screens, in that order - the collapsible detail row
  // below always carries Count/Worker/Assigned/Completed regardless, so
  // they're never actually lost, just relocated.
  function rangeRow(r) {
    const tr = document.createElement('tr');
    tr.className = 'range-row status-' + r.status;

    const tdId = document.createElement('td');
    tdId.className = 'mono col-range';
    tdId.textContent = String(r.id);
    tr.appendChild(tdId);

    const tdStatus = document.createElement('td');
    const statusLabel = r.status === 'in_progress'
      ? inProgressLabel(r.progress_percent)
      : (r.status === 'completed' ? 'Done' : (r.status === 'skipped' ? 'Skip' : undefined));
    tdStatus.appendChild(statusBadge(r.status, statusLabel));
    if (r.status === 'in_progress' && r.lease_expires_at) {
      const t = fmtTime(r.lease_expires_at);
      const expired = r.lease_expires_at * 1000 < Date.now();
      const note = document.createElement('span');
      note.className = 'lease-note' + (expired ? ' expired-text' : '');
      note.textContent = 'Expires ' + t.display.slice(11, 16);
      note.title = t.iso;
      tdStatus.appendChild(note);
    }
    const hint = document.createElement('span');
    hint.className = 'expand-hint';
    hint.textContent = '›';
    tdStatus.appendChild(hint);
    tr.appendChild(tdStatus);

    const tdLen = document.createElement('td');
    tdLen.className = 'mono';
    tdLen.textContent = String(r.candidate_len);
    tr.appendChild(tdLen);

    const tdRange = document.createElement('td');
    tdRange.className = 'mono';
    tdRange.textContent = `${r.first_candidate} – ${r.last_candidate}`;
    if (r.status === 'in_progress' && r.progress_candidate) {
      const note = document.createElement('span');
      note.className = 'progress-note mono';
      note.textContent = 'Progress: ' + r.progress_candidate +
        (r.progress_percent != null ? ' (' + fmtPercent(r.progress_percent) + ')' : '');
      tdRange.appendChild(note);
    }
    tr.appendChild(tdRange);

    const count = fmtNum(r.end_index - r.start_index);

    const tdCount = document.createElement('td');
    tdCount.className = 'mono col-count';
    tdCount.textContent = count;
    tr.appendChild(tdCount);

    const tdWorker = document.createElement('td');
    tdWorker.className = 'worker col-worker' + (r.worker ? '' : ' none');
    tdWorker.appendChild(workerFragment(r.worker));
    tr.appendChild(tdWorker);

    const tdAssigned = document.createElement('td');
    tdAssigned.className = 'col-assigned';
    setTimeCell(tdAssigned, r.assigned_at);
    tr.appendChild(tdAssigned);

    const tdCompleted = document.createElement('td');
    tdCompleted.className = 'col-completed';
    setTimeCell(tdCompleted, r.completed_at);
    tr.appendChild(tdCompleted);

    const detailRow = document.createElement('tr');
    detailRow.className = 'detail-row';
    const detailTd = document.createElement('td');
    detailTd.colSpan = DETAIL_COLSPAN;
    const grid = document.createElement('div');
    grid.className = 'detail-grid';
    grid.appendChild(detailField('Range', String(r.id), true));
    grid.appendChild(detailField('Count', count, true));
    if (r.alphabet_name) {
      grid.appendChild(detailField('Alphabet', r.alphabet_name, false, `"${r.alphabet}"`));
    }
    if (r.priority_range_id) {
      grid.appendChild(detailField('Priority range', '#' + r.priority_range_id, true));
    }
    if (r.status === 'in_progress') {
      const progressLabel = r.progress_candidate ? `Progress (${fmtPercent(r.progress_percent)})` : 'Progress';
      grid.appendChild(detailField(progressLabel, r.progress_candidate || 'not started', true));
      if (r.lease_expires_at) {
        const t = fmtTime(r.lease_expires_at);
        const expired = r.lease_expires_at * 1000 < Date.now();
        const expiresValue = document.createElement('span');
        if (expired) expiresValue.className = 'expired-text';
        expiresValue.textContent = t.display.slice(11, 16);
        expiresValue.title = t.iso;
        grid.appendChild(detailField('Expires', expiresValue));
      }
    }
    grid.appendChild(detailField('Worker', workerFragment(r.worker)));
    grid.appendChild(detailField('Assigned', tdAssigned.textContent, false, tdAssigned.title));
    grid.appendChild(detailField('Completed', tdCompleted.textContent, false, tdCompleted.title));
    detailTd.appendChild(grid);
    detailRow.appendChild(detailTd);

    tr.addEventListener('click', () => {
      tr.classList.toggle('open');
      detailRow.classList.toggle('open');
    });

    return [tr, detailRow];
  }

  function detailField(label, value, mono, title) {
    const wrap = document.createElement('div');
    const labelEl = document.createElement('span');
    labelEl.className = 'detail-label';
    labelEl.textContent = label;
    const valueEl = document.createElement('span');
    if (mono) valueEl.className = 'mono';
    if (value instanceof Node) {
      valueEl.appendChild(value);
    } else {
      valueEl.textContent = value;
    }
    if (title) valueEl.title = title;
    wrap.appendChild(labelEl);
    wrap.appendChild(valueEl);
    return wrap;
  }

  // A run of more than this many consecutive same-status, same-length ranges
  // collapses down to its first and last plus one placeholder row, so a
  // board with thousands of routine completed/skipped ranges at one length
  // doesn't bury the handful of rows that actually need a look.
  const COLLAPSE_THRESHOLD = 5;
  const REVEAL_BATCH = 10;

  function statusWord(status) {
    switch (status) {
      case 'in_progress': return 'in-progress';
      default: return status;
    }
  }

  // Walks `sortedRanges` (already ordered by candidate_len then start_index)
  // and folds any run of more than COLLAPSE_THRESHOLD consecutive ranges
  // sharing the same status and length down to {first, collapsed-middle,
  // last}. Only consecutive runs are folded - a status that briefly
  // interrupts an otherwise-long run (e.g. a reclaimed split) starts a run
  // of its own rather than being absorbed into a neighboring one.
  function groupRanges(sortedRanges) {
    const groups = [];
    let i = 0;
    while (i < sortedRanges.length) {
      let j = i + 1;
      while (j < sortedRanges.length && sortedRanges[j].status === sortedRanges[i].status && sortedRanges[j].candidate_len === sortedRanges[i].candidate_len) {
        j++;
      }
      const run = sortedRanges.slice(i, j);
      if (run.length > COLLAPSE_THRESHOLD) {
        groups.push({ kind: 'range', range: run[0] });
        groups.push({ kind: 'collapsed', status: run[0].status, candidateLen: run[0].candidate_len, hidden: run.slice(1, -1) });
        groups.push({ kind: 'range', range: run[run.length - 1] });
      } else {
        for (const r of run) groups.push({ kind: 'range', range: r });
      }
      i = j;
    }
    return groups;
  }

  function insertRangeRows(parent, beforeNode, ranges) {
    const frag = document.createDocumentFragment();
    for (const r of ranges) {
      const [tr, detailRow] = rangeRow(r);
      frag.appendChild(tr);
      frag.appendChild(detailRow);
    }
    parent.insertBefore(frag, beforeNode);
  }

  // The placeholder standing in for a collapsed run's hidden middle: reveals
  // batches of REVEAL_BATCH from whichever end the viewer asks for (or
  // everything at once, via "Show all"), inserted right where those rows
  // belong (just above the placeholder for "first", just below it for
  // "last"; "Show all" inserts the whole remaining run, already in order,
  // in one place), and removes itself once nothing is hidden.
  function collapsedRow(group) {
    const hidden = group.hidden;
    const tr = document.createElement('tr');
    tr.className = 'collapsed-row';
    const td = document.createElement('td');
    td.colSpan = DETAIL_COLSPAN;
    const wrap = document.createElement('div');
    wrap.className = 'collapsed-wrap';

    const dots = document.createElement('span');
    dots.className = 'collapsed-dots';
    dots.textContent = '⋮';
    wrap.appendChild(dots);

    const label = document.createElement('span');
    wrap.appendChild(label);

    const btnFirst = document.createElement('button');
    btnFirst.type = 'button';
    btnFirst.className = 'collapsed-btn';
    wrap.appendChild(btnFirst);

    const btnLast = document.createElement('button');
    btnLast.type = 'button';
    btnLast.className = 'collapsed-btn';
    wrap.appendChild(btnLast);

    const btnAll = document.createElement('button');
    btnAll.type = 'button';
    btnAll.className = 'collapsed-btn';
    wrap.appendChild(btnAll);

    function refresh() {
      if (hidden.length === 0) {
        tr.remove();
        return;
      }
      label.textContent = `${hidden.length} more ${statusWord(group.status)} · length ${group.candidateLen}`;
      const n = Math.min(REVEAL_BATCH, hidden.length);
      // When hidden.length <= REVEAL_BATCH, "first n" and "last n" reveal
      // the exact same set as "all" - no point offering three identical
      // buttons, so only "Show all" is shown.
      const distinct = hidden.length > REVEAL_BATCH;
      btnFirst.textContent = `Show first ${n}`;
      btnFirst.style.display = distinct ? '' : 'none';
      btnLast.textContent = `Show last ${n}`;
      btnLast.style.display = distinct ? '' : 'none';
      btnAll.textContent = `Show all ${hidden.length}`;
    }
    refresh();

    btnFirst.addEventListener('click', () => {
      insertRangeRows(tr.parentNode, tr, hidden.splice(0, REVEAL_BATCH));
      refresh();
    });
    btnLast.addEventListener('click', () => {
      insertRangeRows(tr.parentNode, tr.nextSibling, hidden.splice(Math.max(0, hidden.length - REVEAL_BATCH), REVEAL_BATCH));
      refresh();
    });
    btnAll.addEventListener('click', () => {
      insertRangeRows(tr.parentNode, tr, hidden.splice(0, hidden.length));
      refresh();
    });

    td.appendChild(wrap);
    tr.appendChild(td);
    return tr;
  }

  // The gap between wherever the target's main sweep currently is
  // (t.cursor_candidate_len/cursor_next_index) and a not-yet-reached
  // priority range is never persisted server-side (see
  // ranges::find_priority_boundary) - it's computed here, purely for
  // display, from the two cursors the dashboard API already sends. Only
  // rendered when it's actually bounded (same length as the main sweep);
  // a priority range at a longer, not-yet-reached length just gets a plain
  // "not yet reached" note instead, since the true gap there could span
  // several whole lengths and isn't a single meaningful address range.
  function priorityGapRow(t, pr) {
    let text = null;
    if (t.cursor_candidate_len === pr.candidate_len && t.cursor_next_index < pr.start_index) {
      text = `Unclaimed: ${t.cursor_candidate} → ${pr.first_candidate} (not yet carved)`;
    } else if (t.cursor_candidate_len < pr.candidate_len) {
      text = `Not yet reached – main sweep is at length ${t.cursor_candidate_len} (${t.cursor_candidate})`;
    }
    if (!text) return null;

    const tr = document.createElement('tr');
    tr.className = 'gap-row';
    const td = document.createElement('td');
    td.colSpan = 4;
    td.className = 'mono';
    td.textContent = text;
    tr.appendChild(td);
    return tr;
  }

  // A small table of the target's priority ranges (see
  // models::PriorityRange), address-ordered (by length then start) rather
  // than by their own priority field, so it reads like a timeline of the
  // target's search space - with the gap ahead of each not-yet-reached one
  // shown inline via priorityGapRow. Returns null when the target has none.
  function priorityRangeSection(t) {
    if (!t.priority_ranges || t.priority_ranges.length === 0) return null;

    const section = document.createElement('div');
    section.className = 'priority-section';

    const heading = document.createElement('div');
    heading.className = 'priority-heading';
    heading.textContent = 'Priority ranges';
    section.appendChild(heading);

    const table = document.createElement('table');
    table.className = 'priority-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Pattern</th><th>Len</th><th>Priority</th><th>Progress</th></tr>';
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    const sorted = t.priority_ranges.slice().sort((a, b) => a.candidate_len - b.candidate_len || a.start_index - b.start_index);
    for (const pr of sorted) {
      const gapRow = priorityGapRow(t, pr);
      if (gapRow) tbody.appendChild(gapRow);

      const tr = document.createElement('tr');

      const tdPattern = document.createElement('td');
      tdPattern.className = 'mono';
      tdPattern.textContent = pr.pattern;
      tdPattern.title = `"${pr.alphabet}"`;
      tr.appendChild(tdPattern);

      const tdLen = document.createElement('td');
      tdLen.className = 'mono';
      tdLen.textContent = String(pr.candidate_len);
      tr.appendChild(tdLen);

      const tdPriority = document.createElement('td');
      tdPriority.className = 'mono';
      tdPriority.textContent = String(pr.priority);
      tr.appendChild(tdPriority);

      const tdProgress = document.createElement('td');
      const total = pr.end_index - pr.start_index;
      const done = pr.next_index - pr.start_index;
      tdProgress.textContent = pr.next_candidate
        ? `${fmtNum(done)} / ${fmtNum(total)} (next: ${pr.next_candidate})`
        : `Done (${fmtNum(total)})`;
      tr.appendChild(tdProgress);

      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    section.appendChild(table);
    return section;
  }

  function targetCard(t) {
    const card = document.createElement('div');
    card.className = 'target-card' + (t.status === 'solved' ? ' solved' : '');

    const head = document.createElement('div');
    head.className = 'target-head';
    const name = document.createElement('span');
    name.className = 'target-name';
    name.textContent = t.name;
    name.title = 'id ' + t.id;
    head.appendChild(name);
    head.appendChild(statusBadge(t.status));
    if (t.priority) {
      const prio = document.createElement('span');
      prio.className = 'priority-chip';
      prio.textContent = 'priority ' + t.priority;
      head.appendChild(prio);
    }
    card.appendChild(head);

    const hashes = document.createElement('div');
    hashes.className = 'target-hashes mono';
    hashes.textContent = `Hash A: ${t.hash_a_hex}  ·  Hash B: ${t.hash_b_hex}`;
    card.appendChild(hashes);

    if (t.alphabet_name) {
      const alphaLine = document.createElement('div');
      alphaLine.className = 'target-alphabet';
      alphaLine.append('Alphabet: ');
      const alphaName = document.createElement('span');
      alphaName.className = 'mono';
      alphaName.textContent = t.alphabet_name;
      alphaName.title = `"${t.alphabet}"`;
      alphaLine.appendChild(alphaName);
      card.appendChild(alphaLine);
    }

    if (t.description) {
      const description = document.createElement('div');
      description.className = 'target-description';
      // Operator-authored HTML (e.g. "<b>...</b>"), rendered as markup on
      // purpose - see admin_create_target/dashboard.rs. Only ever set via
      // the ADMIN_TOKEN-protected admin API, never from untrusted input.
      description.innerHTML = t.description;
      card.appendChild(description);
    }

    const bounds = document.createElement('div');
    bounds.className = 'target-bounds mono';
    bounds.textContent = `${t.lower_bound} → ${t.upper_bound}`;
    card.appendChild(bounds);

    if (t.skip_regex) {
      const skip = document.createElement('div');
      skip.className = 'target-skip';
      skip.append('Skipping candidates starting with ');
      const pattern = document.createElement('span');
      pattern.className = 'mono';
      pattern.textContent = t.skip_regex;
      skip.appendChild(pattern);
      card.appendChild(skip);
    }

    if (t.status === 'solved') {
      const banner = document.createElement('div');
      banner.className = 'found-banner';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Found';
      banner.appendChild(label);
      const fn = document.createElement('span');
      fn.className = 'filename';
      fn.textContent = t.found_filename || '(filename not recorded)';
      banner.appendChild(fn);
      if (t.found_by) {
        const by = document.createElement('span');
        by.className = 'found-by';
        by.textContent = 'by ' + t.found_by;
        banner.appendChild(by);
      }
      card.appendChild(banner);
    }

    const prioritySection = priorityRangeSection(t);
    if (prioritySection) card.appendChild(prioritySection);

    if (t.ranges.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-ranges';
      empty.textContent = 'No ranges carved yet.';
      card.appendChild(empty);
      return card;
    }

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML =
      '<tr><th class="col-range">Range</th><th>Status</th><th>Len</th><th>First / last candidate</th>' +
      '<th class="col-count">Count</th><th class="col-worker">Worker</th>' +
      '<th class="col-assigned">Assigned</th><th class="col-completed">Completed</th></tr>';
    table.appendChild(thead);

    // Shorter candidates (fewer characters) before longer ones, since a
    // target's search always works through lengths in that order.
    const sortedRanges = t.ranges.slice().sort((a, b) => a.candidate_len - b.candidate_len || a.start_index - b.start_index);

    const tbody = document.createElement('tbody');
    for (const group of groupRanges(sortedRanges)) {
      if (group.kind === 'range') {
        const [row, detailRow] = rangeRow(group.range);
        tbody.appendChild(row);
        tbody.appendChild(detailRow);
      } else {
        tbody.appendChild(collapsedRow(group));
      }
    }
    table.appendChild(tbody);

    const tableScroll = document.createElement('div');
    tableScroll.className = 'table-scroll';
    tableScroll.appendChild(table);
    card.appendChild(tableScroll);
    return card;
  }

  async function refresh() {
    try {
      const resp = await fetch('/api/v1/dashboard', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();

      // Solved targets first, so a find is never buried below the fold; then
      // by priority (highest first), matching the order the server itself
      // claims work in.
      const targets = data.targets.slice().sort((a, b) => {
        const aSolved = a.status === 'solved' ? 0 : 1;
        const bSolved = b.status === 'solved' ? 0 : 1;
        if (aSolved !== bSolved) return aSolved - bSolved;
        return (b.priority || 0) - (a.priority || 0);
      });

      targetsEl.replaceChildren();
      if (targets.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'loading';
        empty.textContent = 'No targets yet.';
        targetsEl.appendChild(empty);
      } else {
        for (const t of targets) targetsEl.appendChild(targetCard(t));
      }

      subheadEl.classList.remove('stale');
      const now = fmtTime(Math.floor(Date.now() / 1000));
      statusEl.textContent = 'updated ' + now.display;
      statusEl.title = now.iso;
    } catch (err) {
      subheadEl.classList.add('stale');
      statusEl.textContent = 'update failed (' + err.message + ') - reload to retry';
      statusEl.removeAttribute('title');
    }
  }

  refresh();
})();
</script>
</body>
</html>
